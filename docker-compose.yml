name: web-security-lab

services:
  gateway:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-8080}:8080"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks: [frontend, backend]
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    image: web-security-lab-frontend:local
    restart: unless-stopped
    networks: [frontend]
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: web-security-lab-api:local
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-web_security_lab}
      DB_USER: ${DB_USER:-web_security_lab}
      DB_PASSWORD: ${DB_PASSWORD:-local-only-password}
      TEACHER_TOKEN: ${TEACHER_TOKEN:-teacher-demo-key}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-web_security_lab}
      POSTGRES_USER: ${DB_USER:-web_security_lab}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-only-password}
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./api/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-web_security_lab} -d ${DB_NAME:-web_security_lab}"]
      interval: 3s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

networks:
  frontend:
  backend:
    internal: true

volumes:
  postgres:
